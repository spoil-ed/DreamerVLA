default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.15.20"
    hooks:
      - id: ruff
        args: ["--preview", "--fix"]
      - id: ruff-format
        # This file is vendored from LIBERO; lint it, but preserve upstream layout.
        exclude: ^dreamervla/envs/libero/venv\.py$

  - repo: local
    hooks:
      - id: dreamervla-commit-message
        name: Check DreamerVLA commit message
        entry: python3 dreamervla/diagnostics/check_commit_message.py
        language: system
        stages: [commit-msg]

  - repo: https://github.com/commit-check/commit-check
    rev: "v0.10.2"
    hooks:
      - id: check-commit-signoff

# https://pre-commit.com/
