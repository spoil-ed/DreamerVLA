[project]
name = "dreamervla"
version = "0.1.0"
description = "JFS-resident RLinf LIBERO + pi0.5 runtime for DreamerVLA"
requires-python = ">=3.11,<3.12"
dependencies = [
    "rlinf",
    "scikit-learn==1.8.0",
    "torch==2.11.0+cu128",
    "torchaudio==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
]

# These groups mirror RLinf's embodied install route. The upstream installer
# performs several separate `uv sync` / `uv pip install` calls; this profile
# makes the three logical layers selectable and lockable from one project.
[project.optional-dependencies]
embodied = [
    "rlinf[embodied]",
]
libero = [
    "bddl==3.6.0",
    "cloudpickle",
    "draccus",
    "easydict",
    "future==1.0.0",
    "gym",
    "nvidia-nvcomp-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rich",
    "rlinf-libero==0.1.1",
    "robosuite==1.4.1",
    "sapien==3.0.1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version < '3.14'",
    "tensorflow-graphics==2021.12.3",
]
pi05 = [
    "av==18.1.0",
    "flash-attn @ https://gh-proxy.com/https://github.com/RLinf/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3%2Bcu12torch2.11cxx11abiTRUE-cp311-cp311-linux_x86_64.whl",
    "jax[cuda12]==0.5.3",
    "orbax-checkpoint==0.11.13",
    "pyarrow==25.0.1",
    "rlinf-openpi==0.1.1",
    "tokenizers>=0.21,<0.22",
    "tyro==1.0.13",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
link-mode = "copy"
override-dependencies = [
    "datasets==3.6.0",
    "setuptools>=69.5.1,<75.9",
    "sympy>=1.13.1",
    "tensorflow-addons==0.23.0; platform_machine == 'x86_64'",
    "tensorflow-metadata<=1.17.3",
    "torch==2.11.0+cu128",
    "torchaudio==2.11.0+cu128",
    "torchcodec>=0.11,<0.12",
    "torchvision==0.26.0+cu128",
    # Matches RLinf's OpenPI runtime. tensorflow-addons still declares the old
    # typeguard<3 range, so this intentionally overrides stale package metadata.
    "typeguard==4.6.0",
    "uvloop==0.21.0",
]
package = false
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-version = ">=0.12.3"

[tool.uv.sources]
rlinf = { path = "../../../../RLinf", editable = true }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
# Same public mirror selected by RLinf's official `--use-mirror` route.
url = "https://mirrors.tencent.com/pytorch-wheels/whl/cu128"
explicit = true
