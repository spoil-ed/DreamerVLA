# @package _global_
# RLinf/OpenPI π0.5 SFT under DreamerVLA's runner lifecycle.
_target_: dreamervla.runners.VLASFTTrainingRunner
seed: 0

data:
  loader:
    _target_: dreamervla.dataset.LeRobotLIBERODataLoaderFactory
    source: ${data.source}
    repo_id: ${data.repo_id}
    revision: ${data.revision}
    model_path: ${task.pi05.base_ckpt_path}
    assets_path: ${task.pi05.assets_path}
    config_name: ${task.pi05.config_name}
    batch_size: 4
    action_horizon: ${task.pi05.action_horizon}
    num_workers: 2
    seed: ${seed}
    shuffle: true

actor:
  policy_cfg:
    target: dreamervla.models.embodiment.Pi05Policy
    kwargs:
      model_path: ${task.pi05.base_ckpt_path}
      assets_path: ${task.pi05.assets_path}
      config_name: ${task.pi05.config_name}
      batch_size: ${actor.global_batch_size}
      num_workers: ${data.loader.num_workers}
      seed: ${seed}
      learning_rate: ${actor.optim.lr}
      lr_warmup_steps: ${actor.optim.lr_warmup_steps}
      total_training_steps: ${actor.optim.total_training_steps}
      action_chunk: ${task.pi05.action_horizon}
      action_dim: ${task.action_dim}
      num_steps: ${task.pi05.num_denoise_steps}
      train_expert_only: true
      add_value_head: false
      rotate_images_180: ${task.pi05.rotate_images_180}
  # Matches RLinf examples/sft/config/libero_sft_openpi.yaml.
  micro_batch_size: ${data.loader.batch_size}
  global_batch_size: 128
  # false matches RLinf's official OpenPI SFT call exactly. Setting true limits
  # loss to the 10x7 environment action slice.
  use_action_chunk_loss: false
  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    # RLinf's current manager defaults to constant-after-linear-warmup because
    # the example's warmup_style key is not consumed by that manager.
    lr_scheduler: constant
    lr_warmup_steps: 1000
    total_training_steps: 30000
  distributed:
    strategy: fsdp
    backend: nccl
    mixed_precision: bf16
    gradient_checkpointing: false
    broadcast_buffers: false
    find_unused_parameters: false
    gradient_as_bucket_view: true
    nccl_timeout_seconds: 1800

training:
  max_steps: 30000
  checkpoint_every: 2000
  milestone_steps: []
  save_at_end: true
  log_every: 1
  distributed_strategy: fsdp
  device: cuda

checkpoint:
  topk: null
