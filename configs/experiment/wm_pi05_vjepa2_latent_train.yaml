# @package _global_
# Latent-only WM supervision; decoder training/evaluation is a separate job.
defaults:
  - wm_pi05_collected_train
  - _self_

run:
  name: wm_pi05_vjepa2_latent_train

world_model:
  transition_type: vjepa2_ac
  transition_init: pretrained
  vjepa2_truncate_rollout_gradients: false

init:
  # Weights-only continuation, not optimizer/step resume. Null starts from the
  # official AC predictor plus fresh adapters, preserving the ablation option.
  world_model_state_ckpt: ${oc.env:WM_INIT_CKPT,null}

training:
  # Full 40-step credit assignment retains recurrent inputs. Keep headroom for
  # the frozen PI0.5 encoder; this runner does not implement accumulation.
  global_batch_size: 64
  wm_warmup_checkpoint_every_steps: 100
