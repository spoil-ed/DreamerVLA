# @package _global_
defaults:
  - wmpo_token_classifier_openvla_onetraj_libero_goal_h1
  - override /task: openvla_onetraj_libero_raw_classifier
  - _self_

run:
  name: dreamer_cls_raw_online_6gpu

launch:
  ngpu: 6
  gpus: 0,1,2,3,4,5

training:
  num_epochs: 20
  batch_size: 2
  val_batch_size: 2
  num_workers: 0
  lr: 3.0e-5
  # Keep the empirically stable BCE recipe. The runner supports asymmetric
  # hard-negative weighting for ablations, but it degraded held-out ordering
  # here; safety is enforced by the logit/terminal calibration gate below.
  false_positive_weight: 1.0
  false_positive_focal_gamma: 0.0
  log_every: 10
  # Maximize held-out success recall subject to zero observed false successes.
  # Window evaluation is redundant for this route and would encode
  # the same raw frames repeatedly through overlapping windows.
  eval_every: 70
  window_eval_enabled: false
  checkpoint_every_epochs: 5
  final_selection_metric: episode_f1
  episode_eval_enabled: true
  episode_threshold_metric: recall_at_zero_fp
  episode_threshold_space: logit
  episode_success_aggregation: terminal_streak
  # Only these tasks have both held-out failures and non-zero safe recall.
  episode_eval_task_ids: [1, 2, 4, 8]
  episode_eval_min_steps: 0
  episode_eval_stride: 1
  episode_eval_batch: 8
  # Adjacent stride-1 classifier windows overlap by 7/8 chunks, so short
  # streaks are highly correlated. Sweep long sustained-evidence gates too.
  episode_success_consecutive_chunks: [2, 3, 4, 6, 8, 12, 16, 20, 24]
  thresh_min: -20.0
  thresh_max: 20.0
  thresh_steps: 192

data:
  success_dir_raw: ${oc.env:DVLA_DATA_ROOT,${oc.env:DVLA_ROOT,.}/data}/collected_rollouts/libero_goal_classifier_raw_200/reward
  success_dir_hidden: null
  failure_dir_raw: null
  failure_dir_hidden: null
  train_split: train
  val_split: val
  val_fraction: 0.2
  split_seed: ${training.seed}
  stratify_by_complete: true
  require_sidecar_contract: false
  require_reference_complete: false
  online_encoder:
    _target_: dreamervla.runtime.online_vla_hidden_encoder.OnlineVLAHiddenEncoder
    model_path: ${task.openvla_oft.ckpt_path}
    unnorm_key: ${task.openvla_oft.dataset_statistics_key}
    token_dim: ${task.openvla_oft.hidden_token.token_dim}
    token_count: ${task.openvla_oft.hidden_token.token_count}
    micro_batch_size: 8
    rotate_images_180: ${task.openvla_oft.expected_rotate_images_180}
    center_crop: true
    image_keys: [agentview_rgb]
    history: ${task.openvla_oft.expected_history}
    num_images_in_input: ${task.openvla_oft.num_images_in_input}
    policy_mode: discrete

runner:
  logger:
    logger_backends: [tensorboard, wandb]

checkpoint:
  topk:
    monitor_key: recall_at_zero_fp
    metric_name: episode_recall_at_zero_fp
    mode: max
    k: 3
