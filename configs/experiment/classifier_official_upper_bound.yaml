# @package _global_
# Pre-mainline CLS capacity test trained only from official LIBERO data.
defaults:
  - wmpo_token_classifier_openvla_onetraj_libero_goal_h1
  - override /classifier: dreamer-cls
  - override /pre_mainline: libero_goal_official
  - _self_

pre_mainline:
  stage: classifier_upper_bound

run:
  name: classifier_official_upper_bound

training:
  # Select the deployment threshold on complete held-out trajectories:
  # score(trajectory) = max_window p(success), followed by an F1 sweep.
  episode_eval_enabled: true
  episode_threshold_metric: macro_f1
  final_selection_metric: episode_f1
  precision: bf16
  update_profile_steps: 8

checkpoint:
  topk:
    monitor_key: macro_f1
    metric_name: episode_macro_f1
    mode: max
    k: 1

runner:
  logger:
    wandb_mode: online

data:
  success_dir_raw: ${task.hdf5_reward_dir}
  success_dir_hidden: ${task.openvla_oft.hidden_token_dir}
  failure_dir_raw: null
  failure_dir_hidden: null
  train_split: train
  val_split: val
  val_fraction: 0.2
  split_seed: ${training.seed}
  stratify_by_complete: true
  require_sidecar_contract: true
  require_reference_complete: false
  required_filenames: ${pre_mainline.official_reward_filenames}
