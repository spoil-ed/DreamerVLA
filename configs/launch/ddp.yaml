# @package _global_
# Default single-node training launcher. Ray and evaluation override this group
# or explicitly declare their own non-torchrun launch mechanics.
launch:
  distributed: true
  ngpu: 8
  gpus: null
  master_addr: 127.0.0.1
  master_port: 29500
  python: python
  write_libero_config: false
  required_target_values: []
  env:
    PYTHONUNBUFFERED: 1
    NCCL_NVLS_ENABLE: 0
