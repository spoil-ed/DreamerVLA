# @package _global_
# Chunk world model over RLinf-aligned pi0.5 PaliGemma prefix outputs.
defaults:
  - dreamer-wm
  - _self_

world_model:
  _target_: dreamervla.models.embodiment.world_model.wm_chunk.ChunkAwareWorldModel
  chunk_size: ${task.observation_latent.chunk_size}
  obs_dim: ${task.observation_latent.wm_obs_dim}
  token_count: ${task.observation_latent.token_count}
  token_dim: ${task.observation_latent.token_dim}
  time_horizon: ${task.observation_latent.chunk_size}
  latent_stage: ${task.observation_latent.latent_stage}
  latent_source: ${task.observation_latent.latent_source}
  action_emb_dim: ${task.observation_latent.action_emb_dim}
  num_action_repeat: ${task.observation_latent.num_action_repeat}
  proprio_dim: ${task.observation_latent.proprio_dim}
  proprio_emb_dim: ${task.observation_latent.proprio_emb_dim}
  num_proprio_repeat: ${task.observation_latent.num_proprio_repeat}
  lang_dim: ${task.observation_latent.lang_dim}
  lang_emb_dim: ${task.observation_latent.lang_emb_dim}
  num_lang_repeat: ${task.observation_latent.num_lang_repeat}
  model_dim: ${task.observation_latent.model_dim}
  # Strict transition ablation on the existing π0.5 RGB-streaming route:
  #   original/random       = the pre-migration baseline
  #   vjepa2_ac/random      = AC architecture without transferred weights
  #   vjepa2_ac/pretrained  = AC architecture with the official predictor
  transition_type: original
  transition_init: random
  vjepa2_checkpoint_path: ${oc.env:VJEPA2_AC_CKPT,null}
  vjepa2_predictor_dim: 1024
  vjepa2_depth: 24
  vjepa2_num_heads: 16
  vjepa2_mlp_ratio: 4.0
  vjepa2_dropout: 0.0
  vjepa2_attention_dropout: 0.0
  vjepa2_use_rope: true
  # Keep every per-step AC prediction supervised, but do not backpropagate
  # recursively through 40 applications of the 24-layer predictor.
  vjepa2_truncate_rollout_gradients: true
  vjepa2_rollout_bptt_steps: 2
  # Predict physical state directly; preserve the external proprio slot width
  # with an invertible pad/slice codec and supervise it at every rollout step.
  vjepa2_proprio_representation: raw_padded
  vjepa2_proprio_loss_scale: 1.0
  # Preserve clean-context one-step learning and supervise actual changes,
  # rather than accepting static decoded output on aggregate latent MSE alone.
  vjepa2_one_step_loss_scale: 1.0
  vjepa2_temporal_difference_loss_scale: 1.0
  # New nonzero LayerScale adapters bound transferred residual branches while
  # the PI0.5 input adapter aligns. Original QKV/MLP/LN tensors stay untouched.
  vjepa2_layer_scale_init: 0.01
  # π0.5 emits three genuine 16x16 image-patch groups. Keep their separate
  # grids and learn a view embedding instead of inventing one 768-token grid.
  vjepa2_spatial_grid: ${task.observation_latent.image_patch_grid}
  vjepa2_spatial_group_count: ${task.observation_latent.image_group_count}
  vjepa2_pretrained_grid_size: 16
  # Learn a transition delta around persistence so the 1024-d adapter does not
  # have to reconstruct every 2048-d PI0.5 feature component from scratch.
  vjepa2_residual_prediction: true
  # A small non-zero residual head keeps the initial delta RMS modest while
  # allowing gradients to reach the pretrained predictor on update one.
  vjepa2_residual_output_init_std: 1.0e-3

ray_components:
  world_model:
    kwargs:
      transition_type: ${world_model.transition_type}
      transition_init: ${world_model.transition_init}
      vjepa2_checkpoint_path: ${world_model.vjepa2_checkpoint_path}
      vjepa2_predictor_dim: ${world_model.vjepa2_predictor_dim}
      vjepa2_depth: ${world_model.vjepa2_depth}
      vjepa2_num_heads: ${world_model.vjepa2_num_heads}
      vjepa2_mlp_ratio: ${world_model.vjepa2_mlp_ratio}
      vjepa2_dropout: ${world_model.vjepa2_dropout}
      vjepa2_attention_dropout: ${world_model.vjepa2_attention_dropout}
      vjepa2_use_rope: ${world_model.vjepa2_use_rope}
      vjepa2_truncate_rollout_gradients: ${world_model.vjepa2_truncate_rollout_gradients}
      vjepa2_rollout_bptt_steps: ${world_model.vjepa2_rollout_bptt_steps}
      vjepa2_proprio_representation: ${world_model.vjepa2_proprio_representation}
      vjepa2_proprio_loss_scale: ${world_model.vjepa2_proprio_loss_scale}
      vjepa2_one_step_loss_scale: ${world_model.vjepa2_one_step_loss_scale}
      vjepa2_temporal_difference_loss_scale: ${world_model.vjepa2_temporal_difference_loss_scale}
      vjepa2_layer_scale_init: ${world_model.vjepa2_layer_scale_init}
      vjepa2_spatial_grid: ${world_model.vjepa2_spatial_grid}
      vjepa2_spatial_group_count: ${world_model.vjepa2_spatial_group_count}
      vjepa2_pretrained_grid_size: ${world_model.vjepa2_pretrained_grid_size}
      vjepa2_residual_prediction: ${world_model.vjepa2_residual_prediction}
      vjepa2_residual_output_init_std: ${world_model.vjepa2_residual_output_init_std}
